<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- CSS Animations -->
    <style>
      @keyframes pulse-box {
        0%, 100% { stroke-opacity: 0.3; transform: scale(1); }
        50% { stroke-opacity: 0.9; transform: scale(1.02); }
      }
      @keyframes scan-line {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(210px); opacity: 0.2; }
      }
      @keyframes float-particle {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-10px) translateX(8px); }
      }
      @keyframes glow-bar {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .bounding-box-anim {
        animation: pulse-box 4s infinite ease-in-out;
        transform-origin: center;
      }
      .scanner {
        animation: scan-line 6s infinite ease-in-out;
      }
      .particle {
        animation: float-particle 5s infinite ease-in-out;
      }
      .glow-border {
        animation: glow-bar 3s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="250" rx="12" fill="url(#bg-grad)" />
  <rect width="900" height="250" rx="12" fill="url(#grid)" />

  <!-- Dynamic / Animated Background Decorator Elements -->
  <line class="scanner" x1="40" y1="20" x2="860" y2="20" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

  <g class="bounding-box-anim" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.35">
    <rect x="50" y="45" width="130" height="75" rx="6" stroke-dasharray="4 2" />
    <path d="M 45 40 L 55 40 M 45 40 L 45 50" stroke="#ec4899" stroke-width="3" />
    <path d="M 185 40 L 175 40 M 185 40 L 185 50" stroke="#ec4899" stroke-width="3" />
    <path d="M 45 125 L 55 125 M 45 125 L 45 115" stroke="#ec4899" stroke-width="3" />
    <path d="M 185 125 L 175 125 M 185 125 L 185 115" stroke="#ec4899" stroke-width="3" />
  </g>

  <g class="bounding-box-anim" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.25">
    <rect x="710" y="130" width="140" height="80" rx="6" stroke-dasharray="4 2" />
    <path d="M 705 125 L 715 125 M 705 125 L 705 135" stroke="#06b6d4" stroke-width="3" />
    <path d="M 855 125 L 845 125 M 855 125 L 855 135" stroke="#06b6d4" stroke-width="3" />
  </g>

  <circle class="particle" cx="120" cy="180" r="4" fill="#38bdf8" opacity="0.4" />
  <circle class="particle" cx="780" cy="60" r="5" fill="#a855f7" opacity="0.5" />
  <circle class="particle" cx="830" cy="90" r="3" fill="#f43f5e" opacity="0.4" />

  <rect class="glow-border" x="0" y="244" width="900" height="6" rx="3" fill="url(#accent-grad)" />

  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" opacity="0.6">
    <rect x="50" y="195" width="115" height="24" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="107" y="211" fill="#94a3b8" text-anchor="middle">🏷️ Bounding Box</text>

    <rect x="175" y="195" width="115" height="24" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="232" y="211" fill="#94a3b8" text-anchor="middle">📐 Polygons</text>

    <rect x="300" y="195" width="125" height="24" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="362" y="211" fill="#94a3b8" text-anchor="middle">🧩 Segmentation</text>

    <rect x="435" y="195" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="487" y="211" fill="#94a3b8" text-anchor="middle">🎬 Video 4D</text>

    <rect x="550" y="195" width="110" height="24" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="605" y="211" fill="#94a3b8" text-anchor="middle">☁️ 3D LiDAR</text>
  </g>

  <!-- FOREGROUND TEXT -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="260" y="38" width="380" height="26" rx="13" fill="url(#accent-grad)" opacity="0.2" />
    <rect x="260" y="38" width="380" height="26" rx="13" fill="none" stroke="#a855f7" stroke-width="1" />
    <text x="450" y="55" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">EXPLORE COMPUTER VISION ECOSYSTEM</text>
  </g>

  <text x="450" y="108" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
    Awesome Image Annotation Platform
  </text>

  <text x="450" y="142" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" text-anchor="middle">
    Curated Directory of SaaS &amp; Open-Source Computer Vision Labeling Solutions
  </text>

  <text x="450" y="168" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    ⚡ 2026 Edition • AI DataOps • Dataset Quality • Auto-Labeling
  </text>
</svg>
