<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 250"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="50%" stop-color="#ec4899"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 30 0 L 0 0 0 30"/></pattern><style>@keyframes pulse-box{0%{stroke-opacity:.3;transform:scale(1)}50%{stroke-opacity:.9;transform:scale(1.02)}}@keyframes scan-line{0%{transform:translateY(0);opacity:.2}50%{opacity:.8}}@keyframes float-particle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-10px) translateX(8px)}}@keyframes glow-bar{0%{opacity:.6}50%{opacity:1}}.bounding-box-anim{animation:pulse-box 4s infinite ease-in-out;transform-origin:center}.scanner{animation:scan-line 6s infinite ease-in-out}.particle{animation:float-particle 5s infinite ease-in-out}.glow-border{animation:glow-bar 3s infinite ease-in-out}</style></defs><rect width="900" height="250" fill="url(#bg-grad)" rx="12"/><rect width="900" height="250" fill="url(#grid)" rx="12"/><line x1="40" x2="860" y1="20" y2="20" stroke="#06b6d4" stroke-dasharray="6 4" stroke-width="1.5" class="scanner" opacity=".6"/><g fill="none" stroke="#8b5cf6" stroke-width="1.5" class="bounding-box-anim" opacity=".35"><rect width="130" height="75" x="50" y="45" stroke-dasharray="4 2" rx="6"/><path stroke="#ec4899" stroke-width="3" d="M 45 40 L 55 40 M 45 40 L 45 50"/><path stroke="#ec4899" stroke-width="3" d="M 185 40 L 175 40 M 185 40 L 185 50"/><path stroke="#ec4899" stroke-width="3" d="M 45 125 L 55 125 M 45 125 L 45 115"/><path stroke="#ec4899" stroke-width="3" d="